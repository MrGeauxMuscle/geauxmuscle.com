<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GeauxMuscle privacy policy. Your data stays on your devices.">
<meta name="theme-color" content="#030508">
<link rel="icon" href="/icon-192.png">
<title>Not found — GeauxMuscle</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500&display=swap">
<style>
/* Layout: one dark Aegis console. A ground painted bg-0→bg-1→bg-0 with three radial blooms, tinted panels at radius-18 with hairline borders, one cyan light per screen. Dark only, by design. */
:root{
  color-scheme:dark;
  --bg-0:#030508;--bg-1:#070c14;
  --panel:rgba(12,18,28,.88);--panel-border:rgba(232,246,255,.10);
  --text:#e8f6ff;--text-dim:rgba(232,246,255,.62);
  --accent:#35d6ff;--on-accent:#030508;--track:rgba(232,246,255,.08);
  --green:#5dff9e;--amber:#ffb454;
  --glow-top:#10263a;--heart:#ff453a;--oxygen:#0a84ff;--energy:#ff9f0a;--steps:#ffd60a;--exercise:#30d158;
  --font-display:"Chakra Petch",system-ui,sans-serif;
  --font-body:"Space Grotesk",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --glow:0 0 24px rgba(53,214,255,.45);--glow-lit-bar:0 0 6px rgba(53,214,255,.9);
  --r-panel:18px;--r-hero:20px;--r-tile:16px;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));--gutter-r:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-0);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-0)}
.ground{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(420px 420px at 50% 0,rgba(16,38,58,.8),transparent 70%),
  radial-gradient(560px 560px at 100% 0,rgba(10,132,255,.16),transparent 70%),
  radial-gradient(560px 560px at 0 100%,rgba(255,69,58,.11),transparent 70%),
  linear-gradient(var(--bg-0),var(--bg-1) 50%,var(--bg-0))}
.wrap{max-width:1080px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
a{color:var(--accent);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
.caps{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}
.caps.lit{color:var(--accent)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--text-dim)}

/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;backdrop-filter:blur(14px);background:rgba(3,5,8,.72);border-bottom:1px solid var(--panel-border)}
.nav{display:flex;align-items:center;gap:14px;height:60px}
.nav img{width:34px;height:34px;border-radius:9px;border:1px solid var(--panel-border)}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.06em}
.navlinks{margin-left:auto;display:flex;gap:22px}
.navlinks a{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.navlinks a:hover{color:var(--accent)}
@media(max-width:640px){.navlinks a:not(.keep){display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:72px 56px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-block:48px 40px}}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:700;line-height:1.02;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--accent);text-shadow:var(--glow)}
.lede{font-size:17px;color:var(--text-dim);max-width:34em;margin-top:18px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:9999px;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.04em;border:1px solid transparent;min-width:0}
.btn.fill{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow)}
.btn.line{border-color:rgba(232,246,255,.28);color:var(--text)}
.btn.line:hover{border-color:var(--accent);color:var(--accent)}
.platforms{display:flex;gap:18px;margin-top:22px}
.platforms span{font-size:12px;color:var(--text-dim)}
.platforms b{color:var(--text);font-weight:500}

/* set-check mock */
.setcheck{background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--r-hero);padding:18px;position:relative;overflow:hidden;
  background-image:linear-gradient(rgba(53,214,255,.10),rgba(53,214,255,.02))}
.setcheck::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:9999px;background:var(--accent);box-shadow:var(--glow-lit-bar)}
.bracket{position:absolute;width:18px;height:18px;border:1.5px solid var(--accent);opacity:.7}
.bracket.tl{left:8px;top:8px;border-right:0;border-bottom:0}.bracket.tr{right:8px;top:8px;border-left:0;border-bottom:0}
.bracket.bl{left:8px;bottom:8px;border-right:0;border-top:0}.bracket.br{right:8px;bottom:8px;border-left:0;border-top:0}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sc-rows{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sc-row{padding:14px;border-radius:var(--r-tile);border:1px solid var(--panel-border);background:rgba(3,5,8,.5)}
.sc-row .n{font-family:var(--font-mono);font-weight:600;font-size:34px;line-height:1;margin-top:6px}
.sc-row.you .n{color:var(--green)}
.seal{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.seal svg{width:14px;height:14px}
.notconf{color:var(--amber)}
.sc-q{margin-top:16px;font-size:14px}
.sc-btns{display:flex;gap:12px;margin-top:10px}
.sc-btns .btn{flex:1;padding-block:10px}
.sc-btns .ok{background:var(--green);color:var(--on-accent)}
.sc-btns .no{border-color:rgba(255,180,84,.6);color:var(--amber)}
.sc-foot{margin-top:14px;font-size:11px;color:var(--text-dim)}
.bar{height:5px;border-radius:9999px;background:var(--track);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:80%;background:var(--accent);box-shadow:0 0 6px rgba(53,214,255,.6)}
@media(prefers-reduced-motion:no-preference){.bar i{animation:grow .6s ease-out}}
@keyframes grow{from{width:0}}

/* sections */
section{padding-block:56px}
section+section{border-top:1px solid var(--panel-border)}
.sec-head{max-width:40em}
.sec-head h2{font-size:clamp(24px,3.4vw,34px);font-weight:700;margin-top:10px;line-height:1.1}
.sec-head p{margin-top:12px;color:var(--text-dim)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
@media(max-width:820px){.grid3{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--r-panel);padding:18px;min-width:0}
.panel h3{font-size:18px;font-weight:600;margin-top:12px}
.panel p{margin-top:8px;color:var(--text-dim);font-size:14px}
.panel .quote{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(3,5,8,.55);border:1px solid var(--panel-border);font-family:var(--font-mono);font-size:12px;color:var(--text)}
.step{display:flex;align-items:center;gap:10px}
.step .lamp{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:var(--glow-lit-bar)}
@media(prefers-reduced-motion:no-preference){.step .lamp{animation:blink 1.1s ease-in-out infinite alternate}}
@keyframes blink{to{opacity:.35}}

/* ships */
.ships{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;margin-top:32px;align-items:start}
@media(max-width:820px){.ships{grid-template-columns:1fr}}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:520px){.readouts{grid-template-columns:1fr}}
.tile{border-radius:var(--r-tile);padding:14px;border:1px solid rgba(53,214,255,.55);background:linear-gradient(rgba(53,214,255,.34),rgba(53,214,255,.05)),var(--panel)}
.tile .v{font-family:var(--font-mono);font-weight:600;font-size:26px;line-height:1;margin-top:10px}
.tile .u{font-size:12px;color:var(--text-dim);margin-top:4px}
.lifts{display:flex;flex-direction:column;gap:10px}
.lift{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-tile);background:var(--panel);border:1px solid var(--panel-border)}
.lift .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.lift .t{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.lift .s{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.lift.done .t{color:var(--exercise)}

/* honest */
.honest{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px}
@media(max-width:820px){.honest{grid-template-columns:1fr}}
.rule{display:flex;gap:14px;padding:16px;border-radius:var(--r-panel);background:var(--panel);border:1px solid var(--panel-border)}
.rule .k{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);flex:none;width:9em}
.rule .b{color:var(--text-dim);font-size:14px;min-width:0}
.rule .b b{color:var(--text);font-weight:500}

/* private + cta */
.cta{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:28px;border-radius:var(--r-hero);background:linear-gradient(rgba(53,214,255,.18),rgba(53,214,255,.04)),var(--panel);border:1px solid rgba(53,214,255,.45);margin-top:32px}
@media(max-width:820px){.cta{grid-template-columns:1fr}}
.cta h3{font-size:22px;font-weight:700}
.cta p{color:var(--text-dim);margin-top:8px;font-size:14px}
.cta .btn{white-space:nowrap}

footer{border-top:1px solid var(--panel-border);padding-block:28px 36px;font-size:12px;color:var(--text-dim)}
.foot{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.foot .brand{font-size:13px;color:var(--text)}
.foot a{color:var(--text-dim)}.foot a:hover{color:var(--accent)}
.foot .r{margin-left:auto}
</style>
<style>
.doc{max-width:46em;padding-block:48px 72px}
.doc h1{font-size:clamp(28px,4vw,40px);font-weight:700;margin-top:10px;line-height:1.1}
.doc h2{font-size:20px;font-weight:600;margin-top:40px;color:var(--accent)}
.doc p,.doc li{margin-top:14px;color:var(--text-dim);font-size:15px}
.doc p strong{color:var(--text);font-weight:500}
.doc p:first-of-type strong{font-family:var(--font-mono);font-size:13px}
.tbl{overflow-x:auto;margin-top:16px;border:1px solid var(--panel-border);border-radius:var(--r-tile);background:var(--panel)}
.doc table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.doc th{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-align:left;padding:12px 14px;border-bottom:1px solid var(--panel-border)}
.doc td{padding:12px 14px;vertical-align:top;color:var(--text-dim);border-bottom:1px solid var(--panel-border)}
.doc tr:last-child td{border-bottom:0}
.doc td:first-child{color:var(--text);font-weight:500;white-space:nowrap}
.doc a{color:var(--accent)}
</style>
</head>
<body>
<div class="ground"></div>
<header><div class="wrap nav">
  <a href="/" style="display:contents"><img src="/icon-192.png" alt="GeauxMuscle app icon"><span class="brand">GEAUXMUSCLE</span></a>
  <nav class="navlinks"><a class="keep" href="/">Home</a></nav>
</div></header>
<main class="wrap doc"><div class="caps lit">404</div><h1>Nothing lifts here.</h1><p>That page doesn't exist. <a href="/">Back to GeauxMuscle</a>.</p></main></body></html>
